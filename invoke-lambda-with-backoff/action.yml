name: "Invoke AWS Lambda with Backoff"
description: "Invoke an AWS Lambda using GitHub OIDC with exponential backoff retry logic. Make sure you have id_token permission in your workflow."

inputs:
  role-to-assume:
    description: "Full ARN of the IAM role to assume (required)"
    required: true
  function-name:
    description: "Name or ARN of the Lambda function"
    required: true
  region:
    description: "AWS region (default: eu-central-1)"
    required: false
    default: "eu-central-1"
  payload:
    description: "JSON payload as string, @file.json, file://path or fileb://path"
    required: false
    default: "{}"
  payload-file:
    description: "Path to a JSON request file; cannot be combined with a non-default payload"
    required: false
    default: ""
  read-timeout:
    description: "AWS CLI socket read timeout in seconds"
    required: false
    default: "60"
  connect-timeout:
    description: "AWS CLI connection timeout in seconds"
    required: false
    default: "60"
  log-response:
    description: "Print response and error bodies; false suppresses bodies and returned logs"
    required: false
    default: "true"
  log-type:
    description: "Log type to request from Lambda (e.g., Tail)"
    required: false
    default: "None"
  max-attempts:
    description: "Maximum number of retry attempts (default: 8)"
    required: false
    default: "8"
  initial-delay:
    description: "Initial delay in seconds for exponential backoff (default: 2)"
    required: false
    default: "2"

outputs:
  response:
    description: "The response from the Lambda function"
    value: ${{ steps.invoke.outputs.response }}
  success:
    description: "Whether the Lambda invocation was successful"
    value: ${{ steps.invoke.outputs.success }}

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.region }}

    - name: Invoke Lambda function with backoff
      id: invoke
      shell: bash
      env:
        FUNCTION_NAME: ${{ inputs.function-name }}
        REGION: ${{ inputs.region }}
        PAYLOAD: ${{ inputs.payload }}
        PAYLOAD_FILE: ${{ inputs.payload-file }}
        LOG_TYPE: ${{ inputs.log-type }}
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        INITIAL_DELAY: ${{ inputs.initial-delay }}
        READ_TIMEOUT: ${{ inputs.read-timeout }}
        CONNECT_TIMEOUT: ${{ inputs.connect-timeout }}
        LOG_RESPONSE: ${{ inputs.log-response }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/invoke.sh"
